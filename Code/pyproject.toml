[project]
name = "event-in-a-box"
version = "0.1.0"
description = "Event in a Box - technical foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-bdd>=8.1,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "unit: pure business/unit-level tests that avoid PostgreSQL where practical",
    "integration: tests that cross a real boundary such as PostgreSQL or Django views",
    "acceptance: pytest-bdd user-visible flow tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
