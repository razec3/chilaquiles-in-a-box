{% load static %}<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Event in a Box{% endblock %} · Transgourmet</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="app-logo" href="{% url 'event_in_a_box:event_input' %}">
        <svg class="ribbon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2c-3 0-5 2-5 5 0 2 1 3.5 2.5 4.5L7 20l5-3 5 3-2.5-8.5C16 10.5 17 9 17 7c0-3-2-5-5-5z" fill="currentColor"/>
        </svg>
        TRANSGOURMET
      </a>
      <div class="app-header-icons">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.4" fill="currentColor"/><circle cx="18" cy="21" r="1.4" fill="currentColor"/></svg>
      </div>
    </header>
    <nav class="breadcrumb">
      WEBSHOP / <span class="current-section">EVENT IN A BOX</span> / <span class="current-page">{% block breadcrumb_page %}{% endblock %}</span>
    </nav>
    <main class="app-content">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
