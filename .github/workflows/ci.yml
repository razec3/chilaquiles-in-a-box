name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: event_in_a_box_ci
  POSTGRES_USER: event_in_a_box_ci
  POSTGRES_PASSWORD: ci-test-password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_in_a_box_ci
          POSTGRES_USER: event_in_a_box_ci
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_in_a_box_ci -d event_in_a_box_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"

      - name: Install dependencies
        working-directory: Code
        run: uv sync --frozen

      - name: Check formatting
        working-directory: Code
        run: uv run ruff format --check .

      - name: Lint
        working-directory: Code
        run: uv run ruff check .

      - name: Django system check
        working-directory: Code
        run: uv run python manage.py check

      - name: Check for missing migrations
        working-directory: Code
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run unit tests
        working-directory: Code
        run: uv run pytest tests/unit

      - name: Run integration tests
        working-directory: Code
        run: uv run pytest tests/integration

      - name: Run acceptance tests
        working-directory: Code
        run: uv run pytest tests/acceptance

      - name: Build application image
        run: docker build -f Code/Dockerfile -t event-in-a-box:ci .
